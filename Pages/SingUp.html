        <h2>Formulario de registro</h2>

        <form action="" method="post">
        <div>
            <label for="txtNombre">
                <b>Nombre:</b>
            </label>
            <br>
            <input type="text" name="txtNombre" id="txtNombre" placeholder="Ingrese su nombre" required>
            <br><br>
            <label for="txtApellido">
                <b>Apellido:</b>
            </label>
            <br>
            <input type="text" name="txtApellido" id="txtApellido" placeholder="Ingrese su apellido" required>
            <br><br>
        </div>

        <div>

            <label for="txtProvincia">
                <b>Provincia:</b>
            </label>
            <br>
            <input type="text" name="txtProvincia" id="txtProvincia" placeholder="Ingrese su provincia" required>
            <br><br>
            <label for="txtCiudad">
                <b>Ciudad:</b>
            </label>
            <br>
            <input type="text" name="txtCiudad" id="txtCiudad" placeholder="Ingrese su ciudad" required>
            <br><br>
            <label for="txtDireccion">
                <b>Dirección:</b>
            </label>
            <br>
            <input type="text" name="txtDireccion" id="txtDireccion" placeholder="Ingrese su ciudad" required>
            <br><br>

        </div>

        <div>
            <label for="txtEmail">
                <b>Email:</b>
            </label>
            <br>
            <input type="email" name="txtEmail" id="txtEmail" placeholder="Ingrese su email" required>
            <br><br>
            <label for="txtPass">
                <b>Contraseña:</b>
            </label>
            <br>
            <input type="password" name="txtPass" id="txtPass" placeholder="Ingrese su Contraseña" required>
            <br><br>
        </div>

        <div>

            <label for="date">
                <b>Fecha de nacimiento:</b>
            </label>
            <br>
            <input type="date" name="date" id="date" placeholder="Ingrese su fecha de nacimiento" required>

        </div>

        <div>
            <br><br>
            <input type="submit" value="Confirmar">
        </div>

    </form>
        
        <script src="" async defer></script>
    </body>
</html>
