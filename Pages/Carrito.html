<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noble Cebada - Carrito</title>
  <link rel="stylesheet" href="../Assets/styles.css">
</head>
<body>

  <main class="carrito-main" style="max-width: 800px; margin: 40px auto; padding: 20px; font-family: sans-serif;">
    <h1 class="titulo" style="text-align: center; color: #333;">Tu carrito</h1>
    
    <section id="cart-items" class="cart-items" style="margin-top: 20px;"></section>
    
    <div id="cart-summary" class="cart-summary" style="margin-top: 30px; text-align: right;"></div>
  </main>

  <footer class="footer" style="text-align: center; margin-top: 50px;">
    <p>© 2025 Noble Cebada · Todos los derechos reservados</p>
  </footer>

  <script>
    let carrito = JSON.parse(localStorage.getItem("carrito")) || [];

    function renderizarCarrito() {
        const contenedorItems = document.getElementById("cart-items");
        const contenedorResumen = document.getElementById("cart-summary");

        if (carrito.length === 0) {
            contenedorItems.innerHTML = `
                <div style="text-align: center; margin-top: 30px;">
                    <p style="font-size: 1.2rem; color: #666; margin-bottom: 20px;">Tu carrito está vacío.</p>
                    <a href="../index.html" style="display: inline-block; background: #2c3e50; color: white; text-decoration: none; padding: 10px 20px; border-radius: 5px; font-weight: bold;">
                        Volver a la Tienda 🧉
                    </a>
                </div>
            `;
            contenedorResumen.innerHTML = "";
            return;
        }

        contenedorItems.innerHTML = "";
        carrito.forEach((item, index) => {
            const fila = document.createElement("div");
            fila.style = "display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #ddd;";
            fila.innerHTML = `
                <div style="display: flex; align-items: center; gap: 15px;">
                    <img src="../${item.imagen.replace("assets/", "Assets/")}" alt="${item.nombre}" style="width: 60px; height: 60px; object-fit: cover; border-radius: 5px;">
                    <div>
                        <h3 style="margin: 0; font-size: 1.1rem;">${item.nombre}</h3>
                        <p style="margin: 5px 0 0 0; color: #666;">Cantidad: ${item.cantidad} x $${item.precio.toLocaleString("es-AR")}</p>
                    </div>
                </div>
                <div>
                    <span style="font-weight: bold; font-size: 1.1rem;">$${(item.precio * item.cantidad).toLocaleString("es-AR")}</span>
                    <button onclick="eliminarDelCarrito(${index})" style="background: #e74c3c; color: white; border: none; padding: 5px 10px; margin-left: 15px; border-radius: 3px; cursor: pointer;">X</button>
                </div>
            `;
            contenedorItems.appendChild(fila);
        });

        const total = carrito.reduce((acc, p) => acc + (p.precio * p.cantidad), 0);

        contenedorResumen.innerHTML = `
            <h2 style="margin-bottom: 20px;">Total: <span style="color: #2c3e50;">$${total.toLocaleString("es-AR")}</span></h2>
            <button onclick="procesarPagoServidor()" style="background: #27ae60; color: white; border: none; padding: 12px 25px; font-size: 1.1rem; border-radius: 5px; cursor: pointer; font-weight: bold;">
                Confirmar y Pagar Compra 💳
            </button>
        `;
    }

    function eliminarDelCarrito(index) {
        carrito.splice(index, 1);
        localStorage.setItem("carrito", JSON.stringify(carrito));
        renderizarCarrito();
    }

    async function procesarPagoServidor() {
        const token = localStorage.getItem("token");
        const usuarioSesion = localStorage.getItem("usuario");

        if (!token || !usuarioSesion) {
            alert("Tu sesión expiró. Por favor, volvé a ingresar.");
            window.location.href = "./LogIn.html";
            return;
        }

        const usuarioReal = JSON.parse(usuarioSesion);
        const total = carrito.reduce((acc, p) => acc + (p.precio * p.cantidad), 0);

        const orden = {
            usuario: {
                id: usuarioReal.id,
                nombre: `${usuarioReal.nombre} ${usuarioReal.apellido}`,
                email: usuarioReal.email
            },
            productos: carrito,
            total: total
        };

        try {
            const respuesta = await fetch("http://localhost:3000/compras", {
                method: "POST",
                headers: { 
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify(orden)
            });

            const data = await respuesta.json();

            if (respuesta.ok) {
                // Informamos del éxito al usuario
                alert(`🎉 ¡Compra exitosa! Código de orden: ${data.idOrden}\n${data.mensaje}`);
                
                // Limpiamos el carrito físicamente de la memoria del navegador
                localStorage.removeItem("carrito");
                carrito = [];

                window.location.href = window.location.origin + "/AW1AsogarayVictoria/index.html";
            } else {
                alert("Error al procesar el cobro: " + data.mensaje);
            }
        } catch (error) {
            console.error("Error en la conexión:", error);
            alert("No se pudo conectar con el servidor de cobros.");
        }
    }

    document.addEventListener("DOMContentLoaded", renderizarCarrito);
  </script>
</body>
</html>
