    <main class="formulario">

      <p>¿No tenés cuenta? <a href="./SignUp.html">Registrate</a></p>
    </main>

    <footer class="footer">

    </footer>

    <script src="../Assets/usuarios.js"></script>

      initLogin();
    </script>
  </body>
