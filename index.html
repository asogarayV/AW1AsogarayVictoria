<!DOCTYPE html> 
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Noble Cebada</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- CSS (SIN barra al principio) -->
    <link rel="stylesheet" href="./Assets/styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  </head>

  <body>
    <header id="navbar"></header>

    <main>
      <!-- Carrusel -->
      <section class="carousel" aria-label="Galería principal">
        <div class="slides">
          <figure class="slide">
            <img src="Assets/img/Mate1.png" alt="Mate artesanal sobre mesa de madera">
            <figcaption>Diseño y tradición para tu ritual diario</figcaption>
          </figure>
          <figure class="slide">
            <img src="Assets/img/MateTermo2.png" alt="Termo y mate listos para compartir">
            <figcaption>Calidad que acompaña todos los días</figcaption>
          </figure>
          <figure class="slide">
            <img src="Assets/img/MatesNosotros.png" alt="Set de mate con accesorios">
            <figcaption>Accesorios que hacen la diferencia</figcaption>
          </figure>
        </div>
      </section>

      <h2 class="titulo">Productos destacados</h2>
      <section class="productos" id="productos-destacados">
        <!-- JS llena las cards -->
      </section>
    </main>

    <footer class="footer">
      <p>© 2025 Noble Cebada · Todos los derechos reservados</p>
      <div class="redes">
        <!-- iconos de redes -->
      </div>
    </footer>

    <!-- OJO: tu JS está en Assets/app.js -->
    <script src="./Assets/app.js"></script>
    <script>
      // Home: usuario logueado, basePath desde raíz = ""
      initLoggedPage("navbar", "productos-destacados", "");
    </script>
  </body>
</html>
