<!DOCTYPE html> 
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Noble Cebada</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="./Assets/styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  </head>

  
  <body onload="initHomePage()">
    <header id="navbar"></header>

    <main>
      <section class="carousel" aria-label="Galería principal">
        <div class="slides">
          <figure class="slide">
            <img src="Assets/img/Mate1.png" alt="Mate artesanal sobre mesa de madera">
            <figcaption>Diseño y tradición para tu ritual diario</figcaption>
          </figure>
          <figure class="slide">
            <img src="Assets/img/MateTermo2.png" alt="Termo y mate listos para compartir">
            <figcaption>Calidad que acompaña todos los días</figcaption>
          </figure>
          <figure class="slide">
            <img src="Assets/img/MatesNosotros.png" alt="Set de mate con accesorios">
            <figcaption>Accesorios que hacen la diferencia</figcaption>
          </figure>
        </div>
      </section>

      <h2 class="titulo">Productos destacados</h2>
      <div class="filtros-container">
            <button class="btn-filtro" onclick="aplicarFiltro('todos')">Todos</button>
            <button class="btn-filtro" onclick="aplicarFiltro('Mates')">Mates</button>
            <button class="btn-filtro" onclick="aplicarFiltro('Termos')">Termos</button>
            <button class="btn-filtro" onclick="aplicarFiltro('Yerbas')">Yerbas</button>
            <button class="btn-filtro" onclick="aplicarFiltro('Accesorios')">Accesorios</button>
          </div>
        <section id="productos-destacados">
        </section>

        <div style="text-align: center; margin: 40px 0;">
    <button class="btn-comprar" onclick="finalizarCompra()">FINALIZAR COMPRA</button>
</div>

    </main>

    <footer class="footer">
      <p>© 2025 Noble Cebada · Todos los derechos reservados</p>
      <div class="redes"></div>
    </footer>

    <script src="./Assets/tienda.js"></script>
    <script>initHomePage();</script>

  </body>
</html>
